version: '3'

networks:
  lore:
    name: lore-network
    driver: bridge

services:
  public-inbox-stack:
    userns_mode: keep-id
    restart: unless-stopped
    build:
      context: .
      dockerfile: ./Containerfile
      args:
        USER_ID: '${UID:-1000}'
        GROUP_ID: '${GID:-1000}'
    env_file:
      - .env
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      - HOME=/tmp
      - DEBUG=false
      - PI_CONFIG=/etc/public-inbox/config
      - PI_DATA_DIR=/data
      - IMAP_FOLDER=INBOX
      - IMAP_SSL=true
      - IMAP_INTERVAL=3600
      - SA_MAX_MAIL_SIZE=4096000
      - EXTINDEX_DESCRIPTION=${EXTINDEX_DESCRIPTION:-All Lore}
    volumes:
      - ./data/:/data/:z
      - ./maildirs/:/Mail:z
      - ./scripts:/scripts:z
      - ./public-inbox/contrib/css/:/static/css/:ro
      - ./configs/pi-configs/:/etc/public-inbox/:z
      - ./logs/:/var/log/public-inbox/:z
    command: >
      uv python main.py
    networks:
      - lore

