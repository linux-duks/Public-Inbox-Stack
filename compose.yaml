version: '3'

networks:
  lore:
    name: lore-network
    driver: bridge

services:
  public-inbox-stack:
    userns_mode: keep-id
    restart: unless-stopped
    build:
      context: .
      dockerfile: ./Containerfile
      args:
        USER_ID: '${UID:-1000}'
        GROUP_ID: '${GID:-1000}'
    user: "${UID:-1000}:${GID:-1000}"
    # uncomment if configuring secrets using .env file
    # env_file:
    #   - ./app.env
    environment:
      - HOME=/tmp
      - XDG_DATA_HOME=/data/state # used by lei
      - XDG_CONFIG_HOME=/data/state # used by lei
      - PI_CONFIG=/configs/pi-configs/config
      - GROKMIRROR_CONF=/configs/grokmirror/grokmirror.conf
      - CONFIG_PATH=/configs.yaml
      - TINYSUPERVISOR_HTTP_PORT=${TINYSUPERVISOR_HTTP_PORT:-8081}
      - TINYSUPERVISOR_VERBOSITY=${TINYSUPERVISOR_VERBOSITY:-info}
      - EXTINDEX_DESCRIPTION=${EXTINDEX_DESCRIPTION:-All Lore}
    volumes:
      - ./data/:/data/:z
      - ./configs.yaml:/configs.yaml:ro
      - ./configs/:/configs/:z
      - ./public-inbox/contrib/css/:/static/css/:ro
      - ./logs/:/var/log/public-inbox/:z
    command: /pistack-controller/.venv/bin/pistack-controller serve
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS \"http://localhost:$${TINYSUPERVISOR_HTTP_PORT:-8081}/health\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    ports:
      - "8080:8080"
      - "8119:8119"
      - "8143:8143"
      - "${TINYSUPERVISOR_HTTP_PORT:-8081}:${TINYSUPERVISOR_HTTP_PORT:-8081}"
    networks:
      - lore
