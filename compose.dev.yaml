version: '3'

# Differences from compose.yaml:
#   - builds ./dev.Containerfile (deps only, project NOT baked)
#   - mounts ./pistack-controller source
#   - runs the controller fresh with `uv run` so edits apply without a rebuild

networks:
  lore:
    name: lore-network
    driver: bridge

services:
  public-inbox-stack:
    userns_mode: keep-id
    restart: unless-stopped
    build:
      context: .
      dockerfile: ./dev.Containerfile
      args:
        USER_ID: '${UID:-1000}'
        GROUP_ID: '${GID:-1000}'
    user: "${UID:-1000}:${GID:-1000}"
    # uncomment if configuring secrets using .env file
    # env_file:
    #   - ./app.env
    environment:
      - HOME=/tmp
      - PI_CONFIG=/etc/public-inbox/config
      - CONFIG_PATH=/configs.yaml
      - TINYSUPERVISOR_HTTP_PORT=${TINYSUPERVISOR_HTTP_PORT:-8081}
      - TINYSUPERVISOR_VERBOSITY=${TINYSUPERVISOR_VERBOSITY:-info}
      - EXTINDEX_DESCRIPTION=${EXTINDEX_DESCRIPTION:-All Lore}
    volumes:
      - ./pistack-controller:/pistack-controller
      - ./data/:/data/:z
      - ./configs.yaml:/configs.yaml:ro
      - ./configs/grokmirror/:/config/:z
      - ./configs/pi-configs/:/etc/public-inbox/:z
      - ./public-inbox/contrib/css/:/static/css/:ro
      - ./logs/:/var/log/public-inbox/:z
    command: uv run --project /pistack-controller pistack-controller serve
    network_mode: "host"

