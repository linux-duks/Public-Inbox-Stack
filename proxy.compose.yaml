version: '3'

networks:
  lore:
    name: lore-network
    driver: bridge

include:
  - ./compose.yaml

services:
  nginx:
    image: docker.angie.software/angie:minimal
    ports:
      - "${SERVE_HTTP_PORT:-80}:80"
      - "${SERVE_HTTPS_PORT:-443}:443"
      - "${SERVE_NNTP_PORT:-119}:119"
      - "${SERVE_IMAP_PORT:-143}:143"
    volumes:
      - ./configs/nginx/angie.conf:/etc/angie/angie.conf:z
      - ./acme:/var/lib/angie/acme:z
      - ./public-inbox/contrib/css/:/var/www/static/css/:ro
      - socket_dir:/run/nginx
    depends_on:
      - public-inbox
    restart: unless-stopped
    networks:
      - lore

  anubis:
    image: ghcr.io/techarohq/anubis:latest
    environment:
      BIND: ":${ANUBIS_PORT}"
      DIFFICULTY: "5"
      SERVE_ROBOTS_TXT: "true"
      TARGET: "unix:/run/nginx/nginx.sock"
      POLICY_FNAME: "/data/cfg/botPolicy.yaml"
      OG_PASSTHROUGH: "true"
      OG_EXPIRY_TIME: "24h"
    healthcheck:
      test: ["CMD", "anubis", "--healthcheck"]
      interval: 5s
      timeout: 30s
      retries: 5
      start_period: 500ms
    ports:
      - ${ANUBIS_PORT}:${ANUBIS_PORT}
    volumes:
      - socket_dir:/run/nginx
      - "./configs/anubis/:/data/cfg/:ro"
    depends_on:
      - nginx
    networks:
      - lore

volumes:
  socket_dir:
