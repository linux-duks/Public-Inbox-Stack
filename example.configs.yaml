# pistack-controller configuration
#
# Copy to configs.yaml (gitignored) and edit. Any leaf value can be overridden
# from .env using the UPPER_SNAKE_CASE of its dotted path, e.g.:
#   imap.inboxes.0.url   ->   IMAP_INBOXES_0_URL
#
# Data layout: mirroring, imap and lei live in subfolders of a shared /data
# parent. extindex ("all") is the cross-inbox aggregate.

paths:
  root: /data
  mirror: /data/mirror
  imap: /data/imap
  lei: /data/lei
  extindex: /data/all

hosting:
  enabled: true

  # serving protocols supported by public-inbox
  http: true
  nntp: true
  imap: false

  # Public-inbox serving URL (public)
  serve_host: lore.domain.tld
  # changing these ports require changing the compose files too
  http_port: 8080
  https_port: 8443
  nntp_port: 8119
  imap_port: 8143

indexing:
  # Index level: basic (no full-text search), medium (no phrase search),
  # full (default)
  level: full

# Each entry mirrors one upstream public-inbox remote into its own subfolder
# of paths.mirror (/data/mirror/<id>). Remove the list (or leave it empty) to
# disable mirroring. `id` is required, must be unique and is used as the
# directory name, so keep it to letters, digits, '.', '_' and '-'.
mirroring:
  - id: lore.domain.tld
    upstream_host: https://lore.domain.tld
    # seconds between grok-pull runs (scheduling handled by tinySupervisor)
    interval: 7200
    # index this source after each pull (replaces GROKMIRROR_MODE=indexed)
    indexing: false
    # refresh the cross-inbox extindex after this source's pulls
    extindex: true
  - id: pi.domain2.tld
    upstream_host: https://pi.domain2.tld
    # interval/indexing/extindex are optional and default to
    # 7200 / false / true; with several sources one shared extindex is enough
    extindex: false

imap:
  enabled: false
  spamcheck_enabled: false
  inboxes:
    - id: list.name
      address: name.list.domain.tld
      # credentials belong in .env as IMAP_INBOXES_0_URL
      # (or here, not committed)
      url: imaps://user:pass@imap.server.tld:993/INBOX

lei:
  enabled: false
  check_interval: 360 # minutes between lei up --all runs
  output_config: lei-output.pi.config
  # merged into every maildir below; set a key per maildir to override it
  default_settings:
    host: https://lore.domain.tld/all
    threads: true
    obfuscate: true

  maildirs:
    # example:
    # "my-search":
    #   query: '(s:rust OR dfn:rust/*) AND rt:2.weeks.ago..'
    #   host: https://another.lore.instance/all
    #   threads: false
    # "rust":
    #   query: '(s:rust OR dfn:rust/*) AND rt:2.weeks.ago..'

# Lei quick docs:
#
# "lei q" supports the same search prefixes used by HTTP(S) public-inbox
# instances:
#
#   s:        match within Subject  e.g. s:"a quick brown fox"
#   d:        match date-time range, git "approxidate" formats supported
#             Open-ended ranges such as `d:last.week..' and
#             `d:..2.days.ago' are supported
#   b:        match within message body, including text attachments
#   nq:       match non-quoted text within message body
#   q:        match quoted text within message body
#   n:        match filename of attachment(s)
#   t:        match within the To header
#   c:        match within the Cc header
#   f:        match within the From header
#   a:        match within the To, Cc, and From headers
#   tc:       match within the To and Cc headers
#   l:        match contents of the List-Id header
#   bs:       match within the Subject and body
#   dfn:      match filename from diff
#   dfa:      match diff removed (-) lines
#   dfb:      match diff added (+) lines
#   dfhh:     match diff hunk header context (usually a function name)
#   dfctx:    match diff context lines
#   dfpre:    match pre-image git blob ID
#   dfpost:   match post-image git blob ID
#   dfblob:   match either pre or post-image git blob ID
#   patchid:  match `git patch-id --stable' output
#   rt:       match received time, like `d:' if sender's clock was correct
#
# Additional search prefixes which only affect the local lei/store:
#
#   L:       match the given label
#   kw:      match the given keywords

#
# tip: use double quotes for email addresses
#
# Example:
# lei q -I $HOST -t -o $base-dir/$NAME/INBOX --dedupe=mid $query
