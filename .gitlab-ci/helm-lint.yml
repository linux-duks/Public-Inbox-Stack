# Lint and render the Helm chart.
#
# The commands live in the Makefile so they run the same locally:
#   make helm-lint
#   make helm-template

helm-lint:
  stage: lint
  tags:
    - self-hosted
  image: debian:trixie-slim
  variables:
    HELM_VERSION: "4.3.1"
  rules:
    - changes:
        - chart/**/*
        - Makefile
        - .gitlab-ci/helm-lint.yml
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends bash ca-certificates curl make tar
    - curl -fsSL "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz" | tar -xz -C /usr/local/bin --strip-components=1 linux-amd64/helm
    - helm version
  script:
    - make helm-lint
    - make helm-template
