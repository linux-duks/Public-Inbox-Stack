# Spell check with typos-cli.
#
# The word list/excludes live in _typos.toml (the git submodules are excluded:
# they are third-party checkouts) and the command in the Makefile, so local and
# CI runs are identical: `make spell-check`.

spell-check:
  stage: test
  tags:
    - self-hosted
  image: debian:trixie-slim
  variables:
    TYPOS_VERSION: "1.52.2"
  rules:
    - changes:
        - "**/*.md"
        - "**/*.py"
        - "**/*.yaml"
        - "**/*.yml"
        - "**/*.sh"
        - "**/*.pl"
        - "**/*.pm"
        - "**/*.j2"
        - Makefile
        - _typos.toml
        - .gitlab-ci/spell-check.yml
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends bash ca-certificates curl make tar
    - curl -fsSL -o /tmp/typos.tar.gz "https://github.com/crate-ci/typos/releases/download/v${TYPOS_VERSION}/typos-v${TYPOS_VERSION}-x86_64-unknown-linux-musl.tar.gz"
    - tar -xzf /tmp/typos.tar.gz -C /usr/local/bin --strip-components=1 ./typos
    - typos --version
  script:
    - make spell-check
