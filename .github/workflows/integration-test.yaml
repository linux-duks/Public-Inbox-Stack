name: "Integration Test: mirroring + indexing"

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      scenario:
        description: "Which scenario set to run"
        type: choice
        options: [full, smoke]
        default: full

permissions:
  contents: read

jobs:
  integration-test:
    runs-on: ubuntu-latest
    # The first run builds the controller image (public-inbox is compiled from
    # source), then runs the baseline, incremental and concurrency scenarios.
    timeout-minutes: 90
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          # .gitmodules uses https:// (public GitLab projects), so no deploy key
          # or url.insteadOf rewrite is needed to fetch the submodules.
          submodules: true

      - name: Compose version
        run: docker compose version

      # Pull requests run the fast smoke scale; main and manual runs use the
      # full scale (400+ lists across the three scenarios).
      - name: Run integration tests
        env:
          SCENARIO: ${{ github.event_name == 'pull_request' && 'smoke' || inputs.scenario || 'full' }}
        run: make -C tests/integration "integration-test${SCENARIO:+-$SCENARIO}"

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-failure-log
          path: tests/integration/.state/failure.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Cleanup
        if: always()
        run: make -C tests/integration integration-test-clean
