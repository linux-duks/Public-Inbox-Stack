{{- if .Values.imagePullSecrets.create.enabled }}
{{- $create := .Values.imagePullSecrets.create }}
{{- $registry := required "imagePullSecrets.create.registry is required when imagePullSecrets.create.enabled is true" $create.registry }}
{{- $username := required "imagePullSecrets.create.username is required when imagePullSecrets.create.enabled is true" $create.username }}
{{- $password := required "imagePullSecrets.create.password is required when imagePullSecrets.create.enabled is true" $create.password }}
{{- $auth := printf "%s:%s" $username $password | b64enc }}
{{- $dockerconfig := dict "auths" (dict $registry (dict "username" $username "password" $password "auth" $auth)) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "public-inbox-stack.imagePullSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "public-inbox-stack.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ $dockerconfig | toJson | b64enc | quote }}
{{- end }}
