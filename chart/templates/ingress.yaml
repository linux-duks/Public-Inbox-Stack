{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "public-inbox-stack.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "public-inbox-stack.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType | default "Prefix" }}
            backend:
              service:
                # Traffic flips between the main service and anubis automatically.
                {{- if $.Values.anubis.enabled }}
                name: {{ include "public-inbox-stack.fullname" $ }}-anubis
                port:
                  number: {{ $.Values.anubis.port }}
                {{- else }}
                name: {{ include "public-inbox-stack.fullname" $ }}
                port:
                  number: {{ $.Values.service.http.port }}
                {{- end }}
          {{- end }}
    {{- end }}
{{- end }}
