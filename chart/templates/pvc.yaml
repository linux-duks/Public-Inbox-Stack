{{- if and .Values.pvc.enabled (not .Values.nfs.enabled) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "public-inbox-stack.fullname" . }}-data-pvc
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "public-inbox-stack.labels" . | nindent 4 }}
spec:
  storageClassName: {{ .Values.pvc.storageClassName }}
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.pvc.size }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "public-inbox-stack.fullname" . }}-config-pvc
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "public-inbox-stack.labels" . | nindent 4 }}
spec:
  storageClassName: {{ .Values.pvc.storageClassName }}
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1GB
{{- end }}
